<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人數位名片 - 杜卲謙</title>
  <!-- 引入 Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* 全局樣式重設與背景設定 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f0f12; /* 深黑質感背景 */
      color: #ffffff;
      display: flex;
      justify-content: center; /* 水平置中 */
      align-items: center;    /* 垂直置中 */
      min-height: 100vh;      /* 全螢幕高度 */
      padding: 20px;
    }

    /* 黑色質感卡片與陰影設定 */
    .profile-card {
      background: #18181c; /* 比背景稍亮的極深灰 */
      width: 100%;
      max-width: 360px;
      padding: 40px 24px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08); /* 細緻邊框線 */
      /* 多層次現代感陰影 */
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6),
                  0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 卡片懸浮微動效 */
    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8),
                  0 0 15px rgba(255, 255, 255, 0.05);
    }

    /* 圓形大頭貼與微光邊框 */
    .avatar-container {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #444, #111);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    /* 名字與文字樣式 */
    .name {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .bio {
      font-size: 0.9rem;
      color: #a0a0ab; /* 淡灰色內文 */
      line-height: 1.5;
      margin-bottom: 28px;
      font-weight: 300;
    }

    /* 按鈕與排列樣式 */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    /* Instagram 按鈕：暗黑微光風格 */
    .btn-instagram {
      background-color: #26262c;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-instagram:hover {
      background-color: #32323a;
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    /* Email 按鈕：高對比白色按鈕 */
    .btn-email {
      background-color: #ffffff;
      color: #0f0f12;
    }

    .btn-email:hover {
      background-color: #e2e2e8;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- 名片主卡片 -->
  <div class="profile-card">
    <!-- 1. 圓形大頭貼 -->
    <div class="avatar-container">
      <img src="https://i.postimg.cc/ydjTYKGg/unnamed.jpg" alt="大頭貼" class="avatar">
    </div>

    <!-- 2. 名字與簡短自我介紹 -->
    <h1 class="name">杜卲謙</h1>
    <p class="bio">開心就好</p>

    <!-- 3. 按鈕區塊 -->
    <div class="button-group">
      <a href="https://instagram.com" target="_blank" class="btn btn-instagram">
        <i class="fab fa-instagram"></i> Instagram
      </a>
      <a href="mailto:your-email@example.com" class="btn btn-email">
        <i class="far fa-envelope"></i> Email 我
      </a>
    </div>
  </div>

</body>
</html>
